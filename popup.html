<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Vinted -> Leboncoin</title>
<style>
  body {
    width: 300px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 14px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    font-size: 13px;
  }
  .stat span:last-child {
    font-weight: 600;
  }
  .actions {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  button {
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #clearBtn {
    background: #ffe1e1;
    color: #a00;
  }
  #migrateBtn {
    background: #e1eaff;
    color: #1a3a8f;
  }
  #exportBtn {
    background: #e1ffe6;
    color: #1a7a2f;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    min-height: 14px;
  }
  .manual-section {
    margin-top: 16px;
    border-top: 1px solid #eee;
    padding-top: 10px;
  }
  .manual-section summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #1a3a8f;
  }
  #manualSearch {
    width: 100%;
    box-sizing: border-box;
    margin: 8px 0;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
  }
  #manualList {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 6px;
  }
  .manual-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid #f2f2f2;
    font-size: 12px;
  }
  .manual-row:last-child {
    border-bottom: none;
  }
  .manual-row label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .manual-row input[type="checkbox"] {
    flex-shrink: 0;
    cursor: pointer;
  }
  .manual-empty {
    padding: 10px 8px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Vinted -> Leboncoin</h1>

  <div class="stat"><span>Items stockés</span><span id="count">0</span></div>
  <div class="stat"><span>Usage storage.local</span><span id="usage">0 Mo</span></div>

  <div class="actions">
    <button id="migrateBtn">Migrer maintenant</button>
    <button id="exportBtn">Exporter en JSON</button>
    <button id="clearBtn">Vider IndexedDB</button>
  </div>

  <div id="status">Prêt</div>

  <details class="manual-section">
    <summary>Marquer manuellement comme importé</summary>
    <input type="text" id="manualSearch" placeholder="Filtrer par titre..." />
    <div id="manualList"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
